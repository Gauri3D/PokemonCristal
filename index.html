<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Pokémon Cristal NFC</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; }
        iframe { width: 100vw; height: 100vh; border: none; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>

    <iframe id="emulator" src=""></iframe>

    <script>
        const nombreJuego = 'Pokemon - Edicion Cristal (Spain).gbc'; 
        const rootUrl = window.location.href.split('index.html')[0];
        const romUrl = rootUrl + nombreJuego;
        
        document.getElementById('emulator').src = https://github.io{encodeURIComponent(romUrl)};
    </script>

</body>
</html>
